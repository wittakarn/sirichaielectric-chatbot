<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SirichaiElectric Chat</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: white;
            overflow: hidden;
        }

        #app {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        /* ── Header ── */
        .chat-header {
            background: linear-gradient(135deg, #cc0000 0%, #990000 100%);
            color: white;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .chat-header-left { display: flex; align-items: center; gap: 10px; }

        .chat-logo {
            width: 34px; height: 34px;
            background: white;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 17px;
        }

        .chat-header-title h2 { font-size: 14px; font-weight: 600; }
        .chat-header-title p  { font-size: 11px; opacity: 0.85; margin-top: 1px; }

        .chat-header-right { display: flex; align-items: center; gap: 8px; }

        .status-dot {
            width: 8px; height: 8px;
            background: #4ade80;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

        .btn-clear {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.35);
            color: white;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
        }
        .btn-clear:hover { background: rgba(255,255,255,0.12); border-color: rgba(255,255,255,0.55); }

        .btn-close-mobile {
            display: none;
            background: transparent;
            border: none;
            color: white;
            padding: 4px;
            cursor: pointer;
            line-height: 0;
            opacity: 0.85;
            transition: opacity 0.2s;
        }
        .btn-close-mobile:hover { opacity: 1; }

        @media (max-width: 480px) {
            .btn-close-mobile { display: flex; align-items: center; justify-content: center; }
        }

        /* ── Quick questions ── */
        #quickQuestions {
            padding: 8px 12px;
            background: white;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            flex-shrink: 0;
        }

        .quick-question {
            padding: 5px 11px;
            background: #f3f4f6;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            font-size: 12px;
            cursor: pointer;
            white-space: nowrap;
            transition: background 0.2s, color 0.2s, border-color 0.2s;
        }
        .quick-question:hover { background: #cc0000; color: white; border-color: #cc0000; }

        /* ── Messages area ── */
        #chatMessages {
            flex: 1;
            overflow-y: auto;
            padding: 14px 12px;
            background: #f9fafb;
        }

        #chatMessages::-webkit-scrollbar { width: 5px; }
        #chatMessages::-webkit-scrollbar-track { background: #f1f1f1; }
        #chatMessages::-webkit-scrollbar-thumb { background: #bbb; border-radius: 3px; }

        .welcome-message {
            text-align: center;
            padding: 28px 16px;
            color: #6b7280;
        }
        .welcome-message h3 { font-size: 18px; color: #1f2937; margin-bottom: 6px; }
        .welcome-message p  { font-size: 13px; }

        .message {
            display: flex;
            margin-bottom: 10px;
            animation: slideIn 0.22s ease-out;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(6px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .message.user { justify-content: flex-end; }

        .message-content {
            max-width: 80%;
            padding: 9px 13px;
            border-radius: 12px;
            word-wrap: break-word;
            line-height: 1.5;
            font-size: 13px;
        }

        .message.assistant .message-content {
            background: white;
            border: 1px solid #e5e7eb;
            color: #1f2937;
            border-bottom-left-radius: 4px;
        }

        .message.user .message-content {
            background: linear-gradient(135deg, #cc0000 0%, #990000 100%);
            color: white;
            border-bottom-right-radius: 4px;
        }

        /* Markdown */
        .message-content ul { margin: 5px 0; padding-left: 17px; }
        .message-content li { margin: 2px 0; }
        .message-content p  { margin: 5px 0; }
        .message-content p:first-child { margin-top: 0; }
        .message-content p:last-child  { margin-bottom: 0; }
        .message-content strong { font-weight: 600; }
        .message-content a { color: #cc0000; text-decoration: none; }
        .message-content a:hover { text-decoration: underline; }

        /* Typing indicator */
        .typing-indicator {
            padding: 9px 13px;
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            border-bottom-left-radius: 4px;
            display: inline-block;
            margin-bottom: 10px;
            animation: slideIn 0.22s ease-out;
        }

        .typing-indicator span {
            display: inline-block;
            width: 6px; height: 6px;
            background: #9ca3af;
            border-radius: 50%;
            margin: 0 2px;
            animation: bounce 1.4s infinite ease-in-out;
        }
        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }

        .error-message {
            background: #fee2e2;
            color: #991b1b;
            padding: 9px 13px;
            border-radius: 8px;
            margin-bottom: 10px;
            font-size: 12px;
            border-left: 3px solid #dc2626;
        }

        /* ── Input area ── */
        .chat-input-area {
            padding: 10px 12px;
            background: white;
            border-top: 1px solid #e5e7eb;
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }

        #messageInput {
            flex: 1;
            padding: 9px 13px;
            border: 2px solid #e5e7eb;
            border-radius: 20px;
            font-size: 13px;
            outline: none;
            font-family: inherit;
            transition: border-color 0.2s;
        }
        #messageInput:focus { border-color: #cc0000; }

        #sendButton {
            padding: 9px 16px;
            background: linear-gradient(135deg, #cc0000 0%, #990000 100%);
            color: white;
            border: none;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s;
            white-space: nowrap;
        }
        #sendButton:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 3px 10px rgba(204, 0, 0, 0.4);
        }
        #sendButton:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
<div id="app">

    <div class="chat-header">
        <div class="chat-header-left">
            <div class="chat-logo">⚡</div>
            <div class="chat-header-title">
                <h2>SirichaiElectric</h2>
                <p>AI Customer Service Assistant</p>
            </div>
        </div>
        <div class="chat-header-right">
            <div class="status-dot" title="Online"></div>
            <button class="btn-clear" onclick="clearConversation()">Clear</button>
            <button class="btn-close-mobile" onclick="closeWidget()" title="Close chat">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
                     stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"/>
                    <line x1="6"  y1="6" x2="18" y2="18"/>
                </svg>
            </button>
        </div>
    </div>

    <div id="quickQuestions">
        <div class="quick-question" onclick="sendQuickQuestion(this.textContent)">มีสายไฟ Yazaki ไหม</div>
        <div class="quick-question" onclick="sendQuickQuestion(this.textContent)">Circuit breakers?</div>
        <div class="quick-question" onclick="sendQuickQuestion(this.textContent)">ราคาสายไฟ</div>
        <div class="quick-question" onclick="sendQuickQuestion(this.textContent)">LED lights</div>
    </div>

    <div id="chatMessages">
        <div class="welcome-message">
            <h3>👋 สวัสดีครับ</h3>
            <p>ยินดีต้อนรับสู่ SirichaiElectric Chatbot<br>มีอะไรให้ช่วยเหลือไหมครับ?</p>
        </div>
    </div>

    <div class="chat-input-area">
        <input
            type="text"
            id="messageInput"
            placeholder="พิมพ์ข้อความ... / Type a message..."
            onkeypress="handleKeyPress(event)"
        >
        <button id="sendButton" onclick="sendMessage()">Send</button>
    </div>

</div>

<script>
    // API URL: same origin as chat.html (works whether loaded directly or in iframe)
    const API_BASE_URL = window.location.origin + window.location.pathname.replace(/chat\.html.*$/, '');

    function closeWidget() {
        window.parent.postMessage({ type: 'sirichai:close' }, '*');
    }
    let conversationId = sessionStorage.getItem('sirichai_conversation_id');
    let isProcessing = false;

    document.addEventListener('DOMContentLoaded', () => {
        document.getElementById('messageInput').focus();
    });

    function handleKeyPress(e) {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    }

    function sendQuickQuestion(q) {
        document.getElementById('messageInput').value = q;
        sendMessage();
    }

    async function sendMessage() {
        const input   = document.getElementById('messageInput');
        const message = input.value.trim();
        if (!message || isProcessing) return;

        input.value  = '';
        isProcessing = true;
        updateSendButton();

        const welcome = document.querySelector('.welcome-message');
        if (welcome) welcome.remove();
        const qq = document.getElementById('quickQuestions');
        if (qq) qq.style.display = 'none';

        addMessage('user', message);
        showTypingIndicator();

        try {
            const res  = await fetch(API_BASE_URL + 'chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message, conversationId })
            });
            const data = await res.json();
            hideTypingIndicator();

            if (data.success) {
                if (data.conversationId) {
                    conversationId = data.conversationId;
                    sessionStorage.setItem('sirichai_conversation_id', conversationId);
                }
                if (data.reset) {
                    clearUI();
                } else {
                    addMessage('assistant', data.response);
                    // Notify parent window (if embedded in iframe) that a new message arrived
                    window.parent.postMessage({ type: 'sirichai:newMessage' }, '*');
                }
            } else {
                showError(data.error || 'An error occurred. Please try again.');
            }
        } catch (err) {
            hideTypingIndicator();
            showError('Failed to connect. Please check your connection.');
            console.error('API Error:', err);
        } finally {
            isProcessing = false;
            updateSendButton();
            input.focus();
        }
    }

    function addMessage(role, content) {
        const container  = document.getElementById('chatMessages');
        const msgDiv     = document.createElement('div');
        msgDiv.className = 'message ' + role;

        const contentDiv     = document.createElement('div');
        contentDiv.className = 'message-content';

        if (role === 'assistant' && typeof marked !== 'undefined') {
            const renderer = new marked.Renderer();
            renderer.link = (token) => {
                const t = token.title ? ` title="${token.title}"` : '';
                return `<a href="${token.href}"${t} target="_blank" rel="noopener noreferrer">${token.text}</a>`;
            };
            marked.setOptions({ breaks: true, gfm: true, renderer });
            contentDiv.innerHTML = marked.parse(content);
        } else {
            contentDiv.textContent = content;
        }

        msgDiv.appendChild(contentDiv);
        container.appendChild(msgDiv);
        scrollToBottom();
    }

    function showTypingIndicator() {
        const container = document.getElementById('chatMessages');
        const div = document.createElement('div');
        div.className = 'typing-indicator';
        div.id = 'typingIndicator';
        div.innerHTML = '<span></span><span></span><span></span>';
        container.appendChild(div);
        scrollToBottom();
    }

    function hideTypingIndicator() {
        const el = document.getElementById('typingIndicator');
        if (el) el.remove();
    }

    function showError(msg) {
        const container = document.getElementById('chatMessages');
        const div = document.createElement('div');
        div.className = 'error-message';
        div.textContent = '❌ ' + msg;
        container.appendChild(div);
        scrollToBottom();
        setTimeout(() => div.remove(), 5000);
    }

    function scrollToBottom() {
        const el = document.getElementById('chatMessages');
        el.scrollTop = el.scrollHeight;
    }

    function updateSendButton() {
        const btn = document.getElementById('sendButton');
        btn.disabled    = isProcessing;
        btn.textContent = isProcessing ? '...' : 'Send';
    }

    async function clearConversation() {
        if (!conversationId) { clearUI(); return; }
        if (!confirm('Clear this conversation?')) return;

        try {
            await fetch(API_BASE_URL + 'conversation/' + conversationId, { method: 'DELETE' });
        } catch (e) { /* ignore */ }

        conversationId = null;
        sessionStorage.removeItem('sirichai_conversation_id');
        clearUI();
    }

    function clearUI() {
        document.getElementById('chatMessages').innerHTML = `
            <div class="welcome-message">
                <h3>👋 สวัสดีครับ</h3>
                <p>ยินดีต้อนรับสู่ SirichaiElectric Chatbot<br>มีอะไรให้ช่วยเหลือไหมครับ?</p>
            </div>`;
        const qq = document.getElementById('quickQuestions');
        if (qq) qq.style.display = 'flex';
        document.getElementById('messageInput').focus();
    }
</script>
</body>
</html>
