<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Widget Demo - SirichaiElectric Chatbot</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #f0f4f8;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .page-content { text-align: center; color: #4a5568; }
        .page-content h1 { font-size: 28px; color: #1a202c; margin-bottom: 8px; }
        .page-content p  { font-size: 15px; margin-bottom: 32px; }

        .embed-box {
            margin-top: 32px;
            background: white;
            border-radius: 12px;
            padding: 24px 28px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            text-align: left;
            max-width: 520px;
        }
        .embed-box h2 { font-size: 14px; font-weight: 600; color: #374151; margin-bottom: 10px; }
        .embed-box pre {
            background: #1e1e2e;
            color: #cdd6f4;
            border-radius: 8px;
            padding: 14px 16px;
            font-size: 12px;
            line-height: 1.6;
            overflow-x: auto;
            white-space: pre-wrap;
            word-break: break-all;
        }
    </style>
</head>
<body>

    <div class="page-content">
        <h1>Your Website Here</h1>
        <p>Click the ⚡ button in the bottom-right corner to open the chat.</p>

        <div class="embed-box">
            <h2>Embed on any website — paste before &lt;/body&gt;:</h2>
            <pre id="embedSnippet">Loading…</pre>
        </div>
    </div>

    <!-- Widget loaded from the shared script — same as any external site would do -->
    <script src="widget-embed.js"></script>

    <script>
        // Show the embed snippet with the real absolute URL
        (function () {
            var base = window.location.href.substring(0, window.location.href.lastIndexOf('/') + 1);
            document.getElementById('embedSnippet').textContent =
                '<!-- SirichaiElectric Chatbot Widget -->\n' +
                '<script src="' + base + 'widget-embed.js"><\/script>';
        })();
    </script>

</body>
</html>
